name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: paper-explainer-platform
  ACR_NAME: papereplainer
  IMAGE_NAME: paper-explainer-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create or use Azure Container Registry
        run: |
          az acr create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "$ACR_NAME" \
            --sku Basic \
            --admin-enabled true \
          || az acr update --name "$ACR_NAME" --admin-enabled true

      - name: Build and push Docker image
        run: |
          az acr login --name "$ACR_NAME"
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            --image "$IMAGE_NAME:latest" \
            .

      - name: Deploy container to Azure App Service
        run: |
          ACR_PASSWORD=$(az acr credential-show --name "$ACR_NAME" --query passwords[0].value -o tsv)
          az webapp config container set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --docker-custom-image-name "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}" \
            --docker-registry-server-url "https://$ACR_NAME.azurecr.io" \
            --docker-registry-server-user "$ACR_NAME" \
            --docker-registry-server-password "$ACR_PASSWORD"
          az webapp restart \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"
